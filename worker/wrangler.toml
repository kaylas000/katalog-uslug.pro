# account_id нужен для деплоя из GitHub Actions по API-токену (whoami может работать и без него).
account_id = "3d735a66c4d587a9d810375620bd2543"

# Адрес API после деплоя: https://katalog-uslug-api.kaylas000.workers.dev (имя воркера + ваш поддомен)
workers_dev = true

# Hyperdrive (прод): создайте конфиг и раскомментируйте блок ниже.
#   npx wrangler hyperdrive create katalog-uslug-db --connection-string="postgres://USER:PASS@HOST:5432/DBNAME"
# Локально без Hyperdrive: скопируйте worker/.dev.vars.example → .dev.vars и задайте DATABASE_URL.
# Локально с Hyperdrive: скопируйте worker/wrangler.local.toml.example → wrangler.local.toml (см. README).

name = "katalog-uslug-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
compatibility_flags = ["nodejs_compat"]

# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<HYPERDRIVE_CONFIG_ID>"

[vars]
ALLOWED_ORIGIN = "https://katalog-uslug.pro"

# trigger: Actions deploy check
