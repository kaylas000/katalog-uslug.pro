# Публикует статический сайт из корня репозитория на GitHub Pages при каждом пуше в main.
# В GitHub → Settings → Pages → Build and deployment → Source: выбрать «GitHub Actions».
# Если оставлен старый режим «Deploy from a branch», переключите на Actions — иначе этот workflow не будет отдавать сайт.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static bundle
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='worker/node_modules' \
            --exclude='node_modules' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
